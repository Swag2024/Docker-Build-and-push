name: Start Second Runner VM

on:
  workflow_dispatch:

jobs:
  start-vm:
    runs-on: Agent  # Yeh tumhara running runner hai

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start VM
        run: |
          az vm start \
            --resource-group test
            --name vm-dev

      - name: Start VM
        run: |
          az vm start \
            --resource-group <YOUR_RG> \
            --name <STOPPED_VM_NAME>
